<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Balanced Random Letter Generator</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 80px;
            }

            #letter {
                font-size: 120px;
                font-weight: bold;
                margin: 30px;
            }

            button {
                font-size: 20px;
                padding: 12px 24px;
                cursor: pointer;
            }

            #stats {
                position: fixed;
                bottom: 10px;
                right: 220px;
                text-align: left;
                font-family: monospace;
            }

            #values-container {
                position: fixed;
                bottom: 10px;
                right: 10px;
                text-align: left;
                font-family: monospace;
                background: #f5f5f5;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            }

            #values-header {
                padding: 10px;
                cursor: pointer;
                background: #e0e0e0;
                border-radius: 5px 5px 0 0;
                margin: 0;
                font-size: 16px;
            }

            #values-content {
                padding: 10px;
                display: none;
            }
        </style>
    </head>
    <body>
        <h1>Balanced Random Capital Letter</h1>

        <div id="letter">?</div>

        <button onclick="generateLetter()">Generate Letter</button>

        <div id="stats"></div>
        <div id="values-container">
            <h3 id="values-header" onclick="toggleValues()">Letter Values</h3>
            <div id="values-content"></div>
        </div>

        <script>
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

            // How many times each letter has appeared
            const counts = {};

            letters.forEach((letter) => {
                counts[letter] = 0;
            });

            // Recent history to reduce short-term repeats
            const recentHistory = [];
            const historySize = 5;

            function weightedChoice(items, weights) {
                const total = weights.reduce((a, b) => a + b, 0);

                let r = Math.random() * total;

                for (let i = 0; i < items.length; i++) {
                    r -= weights[i];
                    if (r <= 0) {
                        return items[i];
                    }
                }

                return items[items.length - 1];
            }

            function generateLetter() {
                const weights = letters.map((letter) => {
                    // Frequency balancing
                    let weight = 1 / Math.pow(counts[letter] + 1, 1.5);

                    // Penalize recently used letters
                    if (recentHistory.includes(letter)) {
                        weight *= 0.15;
                    }

                    return weight;
                });

                const chosen = weightedChoice(letters, weights);

                counts[chosen]++;

                recentHistory.push(chosen);

                if (recentHistory.length > historySize) {
                    recentHistory.shift();
                }

                document.getElementById("letter").textContent = chosen;

                updateStats();
            }

            function updateStats() {
                const sorted = [...letters].sort(
                    (a, b) => counts[b] - counts[a],
                );

                let html = "<h3>Counts</h3>";

                sorted.forEach((letter) => {
                    html += `${letter}: ${counts[letter]}<br>`;
                });

                document.getElementById("stats").innerHTML = html;
            }

            function updateValues() {
                let html = "";
                letters.forEach((letter) => {
                    const value = letter.charCodeAt(0) - 64; // A=1, B=2, etc.
                    html += `${letter}: ${value}<br>`;
                });
                document.getElementById("values-content").innerHTML = html;
            }

            function toggleValues() {
                const content = document.getElementById("values-content");
                const header = document.getElementById("values-header");
                if (content.style.display === "none") {
                    content.style.display = "block";
                    header.style.borderRadius = "5px 5px 0 0";
                } else {
                    content.style.display = "none";
                    header.style.borderRadius = "5px";
                }
            }

            document.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    generateLetter();
                }
            });

            updateStats();
            updateValues();
        </script>
    </body>
</html>
